name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 1. Install dependencies so node_modules exists
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # 2. Install Syft and Grype CLIs directly
      - name: Install Syft and Grype CLIs
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # 3. Generate SBOM from node_modules
      - name: Generate Full SBOM
        run: syft dir:./node_modules --exclude "" -o spdx-json=juiceshop.sbom.json

      # 4. Upload raw SBOM artifact
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom
          path: juiceshop.sbom.json

      # 5. Scan SBOM with Grype → CSV (contains all columns needed for PDF)
      - name: Scan SBOM with Grype (CSV)
        run: |
          grype sbom:juiceshop.sbom.json -o csv > grype-results.csv
        continue-on-error: true

      # 6. Scan SBOM with Grype → SARIF (for GitHub Security tab)
      - name: Scan SBOM with Grype (SARIF)
        run: |
          grype sbom:juiceshop.sbom.json -o sarif > results.sarif
        continue-on-error: true

      # 7. Upload SARIF to GitHub Security
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: "grype-sbom"

      # 8. Install PDF rendering dependencies
      - name: Install PDF Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
          pip install pandas

      # 9. Build the PDF report
      - name: Generate Grype PDF Report
        run: |
          python3 << 'EOF'
          import pandas as pd
          import subprocess
          import html
          import os

          # Load Grype CSV output
          df = pd.read_csv("grype-results.csv")

          # Map Grype CSV columns → report columns
          # Grype CSV columns typically include: vulnerability, severity, package, version, fix, ...
          # We'll rename/select to match the report layout.
          report = pd.DataFrame({
              "CVE ID":            df.get("vulnerability", ""),
              "GHSA / Original ID": df.get("vulnerability", ""),  # Grype uses same field; GHSA often in 'vulnerability' for GHSA IDs
              "Severity":          df.get("severity", ""),
              "Package":           df.get("package", ""),
              "Installed Version": df.get("version", ""),
              "Fix Version":       df.get("fix", ""),
          })

          # Optional: filter to High and Critical only (remove this line to show all)
          # report = report[report["Severity"].str.lower().isin(["high", "critical"])]

          # Build styled HTML table
          rows_html = ""
          for _, row in report.iterrows():
              sev = str(row["Severity"]).lower()
              color = {"critical": "#d32f2f", "high": "#f57c00", "medium": "#fbc02d", "low": "#388e3c"}.get(sev, "#555")
              rows_html += "<tr>" + "".join(
                  f"<td>{html.escape(str(v))}</td>" for v in row.values
              ) + "</tr>"

          html_doc = f"""
          <html>
          <head>
          <meta charset="utf-8">
          <style>
            body {{ font-family: Arial, Helvetica, sans-serif; margin: 20px; }}
            h1 {{ font-size: 22px; margin-bottom: 12px; }}
            table {{ border-collapse: collapse; width: 100%; font-size: 12px; }}
            th {{ background: #f2f2f2; text-align: left; padding: 8px; border: 1px solid #ccc; }}
            td {{ padding: 8px; border: 1px solid #ccc; vertical-align: top; }}
            tr:nth-child(even) {{ background: #fafafa; }}
          </style>
          </head>
          <body>
            <h1>Grype Vulnerability Report</h1>
            <table>
              <thead>
                <tr>
                  <th>CVE ID</th>
                  <th>GHSA / Original ID</th>
                  <th>Severity</th>
                  <th>Package</th>
                  <th>Installed Version</th>
                  <th>Fix Version</th>
                </tr>
              </thead>
              <tbody>
                {rows_html}
              </tbody>
            </table>
          </body>
          </html>
          """

          with open("grype-report.html", "w") as f:
              f.write(html_doc)

          # Convert HTML → PDF
          subprocess.run(["wkhtmltopdf", "--enable-local-file-access", "grype-report.html", "grype-report.pdf"], check=True)
          print("PDF generated: grype-report.pdf")
          EOF

      # 10. Upload the PDF report
      - name: Upload Grype PDF Report
        uses: actions/upload-artifact@v4
        with:
          name: grype-vulnerability-report
          path: grype-report.pdf
