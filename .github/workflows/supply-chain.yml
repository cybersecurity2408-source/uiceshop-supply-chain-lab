cat > .github/workflows/supply-chain.yml << 'EOF'
name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Generate Full SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./node_modules
          format: spdx-json
          output-file: juiceshop.sbom.json
          upload-artifact: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom
          path: juiceshop.sbom.json

      - name: Scan SBOM with Grype
        id: grype-scan
        uses: anchore/scan-action@v3
        with:
          sbom: juiceshop.sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: "grype-sbom"

      - name: Install GuardDog & jq
        run: |
          pip3 install guarddog
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run GuardDog Dependency Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found — cannot resolve pinned versions. Failing."
            exit 1
          fi

          echo "Extracting resolved name@version pairs from package-lock.json..."
          jq -r '
            .packages
            | to_entries[]
            | select(.key != "")
            | select(.value.version != null)
            | "\(.value.name // (.key | sub("^node_modules/"; "")))@\(.value.version)"
          ' package-lock.json | sort -u > resolved-deps.txt

          if [ ! -s resolved-deps.txt ]; then
            echo "No dependencies found to scan."
            exit 0
          fi

          FAILED=0
          mkdir -p guarddog-results

          echo "Scanning resolved dependencies with GuardDog..."
          while IFS= read -r entry; do
            name="${entry%@*}"
            version="${entry##*@}"
            echo "----------------------------------------"
            echo "Scanning package: $name@$version"

            safe_name=$(echo "$name" | tr '/@' '__')
            out_file="guarddog-results/${safe_name}.json"

            if ! guarddog npm scan "$name" "$version" \
              --exclude-rules metadata_mismatch \
              --exclude-rules potentially_compromised_email_domain \
              --exclude-rules unclaimed_maintainer_email_domain \
              --output-format json > "$out_file" 2> "${out_file}.log"; then
              echo "GuardDog reported an error scanning $name@$version:"
              cat "${out_file}.log" || true
              FAILED=1
              continue
            fi

            issue_count=$(jq '[.results[]?.issues // {} | length] | add // 0' "$out_file" 2>/dev/null || echo 0)
            if [ "$issue_count" -gt 0 ]; then
              echo "GuardDog found $issue_count issue(s) in $name@$version:"
              cat "$out_file"
              FAILED=1
            fi
          done < resolved-deps.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more packages failed the GuardDog scan."
            exit 1
          fi

          echo "GuardDog scan completed with no findings."

      - name: Upload GuardDog Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarddog-results
          path: guarddog-results/
          if-no-files-found: ignore
EOF
