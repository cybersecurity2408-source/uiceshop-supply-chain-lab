name: Supply Chain Security

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Install dependencies so node_modules exists.
      #    --ignore-scripts blocks install-time postinstall hooks from running
      #    arbitrary code on the runner before it's even been scanned.
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      # 2. Generate SBOM using Anchore's maintained sbom-action instead of
      #    piping a raw install.sh from `main` into `sh`. This is a versioned,
      #    marketplace-published action rather than an unverified script.
      - name: Generate Full SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./node_modules
          format: spdx-json
          output-file: juiceshop.sbom.json
          upload-artifact: false

      # 3. Upload raw SBOM artifact for download/verification
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom
          path: juiceshop.sbom.json

      # 4. Scan the SBOM with Grype via anchore/scan-action. fail-build:true
      #    means the job actually fails on high+ severity findings instead of
      #    silently continuing. Adjust severity-cutoff to your risk tolerance.
      - name: Scan SBOM with Grype
        id: grype-scan
        uses: anchore/scan-action@v3
        with:
          sbom: juiceshop.sbom.json
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      # 5. Always upload whatever SARIF was produced, even if the scan step
      #    above failed the build — we still want results visible in the
      #    Security tab.
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: "grype-sbom"

      - name: Install GuardDog & jq
        run: |
          pip3 install guarddog
          sudo apt-get update
          sudo apt-get install -y jq

      # 6. Scan the ACTUAL resolved versions from package-lock.json, not
      #    whatever happens to be latest on the npm registry right now.
      #    This job now fails (exit 1) if GuardDog reports any issue that
      #    isn't in the excluded rule set, instead of swallowing every error.
      - name: Run GuardDog Dependency Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f package-lock.json ]; then
            echo "No package-lock.json found — cannot resolve pinned versions. Failing."
            exit 1
          fi

          echo "Extracting resolved name@version pairs from package-lock.json..."
          # Handles lockfileVersion 2/3 (.packages) format.
          jq -r '
            .packages
            | to_entries[]
            | select(.key != "")
            | select(.value.version != null)
            | "\(.value.name // (.key | sub("^node_modules/"; "")))@\(.value.version)"
          ' package-lock.json | sort -u > resolved-deps.txt

          if [ ! -s resolved-deps.txt ]; then
            echo "No dependencies found to scan."
            exit 0
          fi

          FAILED=0
          mkdir -p guarddog-results

          echo "Scanning resolved dependencies with GuardDog..."
          while IFS= read -r entry; do
            name="${entry%@*}"
            version="${entry##*@}"
            echo "----------------------------------------"
            echo "Scanning package: $name@$version"

            safe_name=$(echo "$name" | tr '/@' '__')
            out_file="guarddog-results/${safe_name}.json"

            if ! guarddog npm scan "$name" "$version" \
              --exclude-rules metadata_mismatch \
              --exclude-rules potentially_compromised_email_domain \
              --exclude-rules unclaimed_maintainer_email_domain \
              --output-format json > "$out_file" 2> "${out_file}.log"; then
              echo "GuardDog reported an error scanning $name@$version:"
              cat "${out_file}.log" || true
              FAILED=1
              continue
            fi

            issue_count=$(jq '[.results[]?.issues // {} | length] | add // 0' "$out_file" 2>/dev/null || echo 0)
            if [ "$issue_count" -gt 0 ]; then
              echo "GuardDog found $issue_count issue(s) in $name@$version:"
              cat "$out_file"
              FAILED=1
            fi
          done < resolved-deps.txt

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more packages failed the GuardDog scan."
            exit 1
          fi

          echo "GuardDog scan completed with no findings."

      - name: Upload GuardDog Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarddog-results
          path: guarddog-results/
          if-no-files-found: ignore
